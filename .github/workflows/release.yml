name: Build release
on:
  workflow_dispatch:
  push:
    tags: ['v*-vc*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AIRBRIDGE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AIRBRIDGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AIRBRIDGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AIRBRIDGE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > airbridge-release.jks
          printf 'storeFile=airbridge-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Test and build
        run: ./gradlew testReleaseUnitTest assembleRelease
      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "AirBridge-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: AirBridge-*.apk
          generate_release_notes: true
