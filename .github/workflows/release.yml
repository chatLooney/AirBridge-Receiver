name: Build release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the signed APK
        required: true
        default: v0.3.5-vc9-build4
  push:
    tags: ['v*-vc*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Use official OpenSSL source
        run: |
          sed -i 's#https://mirror.viaduck.org/openssl/openssl-${OPENSSL_BUILD_VERSION}.tar.gz#https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_BUILD_VERSION}/openssl-${OPENSSL_BUILD_VERSION}.tar.gz#' app/src/main/cpp/third_party/openssl-cmake/cmake/BuildOpenSSL.cmake
          sed -i '/set(FORWARD_ANDROID_NDK/a\        set(FORWARD_ANDROID_NDK_ROOT "${ANDROID_NDK}")\n        set(FORWARD_CC "clang")\n        set(FORWARD_CXX "clang++")\n        set(FORWARD_AR "${CMAKE_AR}")\n        set(FORWARD_RANLIB "${CMAKE_RANLIB}")' app/src/main/cpp/third_party/openssl-cmake/cmake/BuildOpenSSL.cmake
          sed -i 's#set(FORWARD_PATH "${ANDROID_TOOLCHAIN_ROOT}/bin/:${ANDROID_TOOLCHAIN_ROOT}/${ANDROID_TOOLCHAIN_NAME}/bin/")#set(FORWARD_PATH "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/")#' app/src/main/cpp/third_party/openssl-cmake/cmake/BuildOpenSSL.cmake
      - name: Prepare Android NDK toolchain
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          "$SDKMANAGER" "ndk;27.0.12077973"
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AIRBRIDGE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AIRBRIDGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AIRBRIDGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AIRBRIDGE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > airbridge-release.jks
          printf 'storeFile=airbridge-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Test and build
        run: ./gradlew testReleaseUnitTest assembleRelease
      - name: Name APK
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: cp app/build/outputs/apk/release/app-release.apk "AirBridge-${RELEASE_TAG}.apk"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: AirBridge-*.apk
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
