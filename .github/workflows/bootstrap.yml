name: Bootstrap AirBridge source
on:
  push:
    paths:
      - AirBridge-bootstrap-source.zip
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source tree
        run: |
          unzip -o AirBridge-bootstrap-source.zip
          rm -f AirBridge-bootstrap-source.zip .github/workflows/bootstrap.yml
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Launch AirBridge 0.3.5"
          git push
