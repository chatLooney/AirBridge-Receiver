name: Bootstrap AirBridge source
on:
  workflow_dispatch:
  push:
    paths:
      - 'AirBridge-upstream-clean.patch.xz.b64'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream source
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/tarek369/screendock.git upstream
          rsync -a --exclude='.git' upstream/ ./
          rm -rf upstream
      - name: Apply AirBridge changes
        run: |
          base64 -d AirBridge-upstream-clean.patch.xz.b64 | xz -d > /tmp/airbridge.patch
          patch -p1 < /tmp/airbridge.patch
      - name: Generate legacy logo assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            out="app/src/main/res/mipmap-${density}"
            mkdir -p "${out}"
            rsvg-convert -w "${size}" -h "${size}" design/icon/tile_legacy.svg -o "${out}/ic_launcher.png"
            cp "${out}/ic_launcher.png" "${out}/ic_launcher_round.png"
          done
          rsvg-convert -w 512 -h 512 design/icon/store_512.svg -o store/store_icon_512.png
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/release.yml'
          git commit -m "Launch AirBridge 0.3.5"
          git push
